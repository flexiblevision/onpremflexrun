[pytest]
# Rooted at the repo, not system_server/, so coverage sees deploy.py, helpers/
# and upgrades/ too. Coverage settings live in .coveragerc - pytest.ini's
# [coverage:*] sections are not a file coverage.py reads.
testpaths = system_server/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = Arduino .git __pycache__ .pytest_cache htmlcov node_modules

addopts =
    --tb=short
    --strict-markers
    --color=yes
    --cov
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml

markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for API endpoints
    slow: Tests that take a long time to run
    network: Tests that require network access
    database: Tests that require database access
    auth: Tests that require authentication
    gpio: Tests for GPIO functionality
    docker: Tests that interact with Docker

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
